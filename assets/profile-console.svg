<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>neko233 profile console</title>
  <desc>A blue and white console-inspired profile banner for neko233.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="1130" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111A35"/>
      <stop offset="0.48" stop-color="#081126"/>
      <stop offset="1" stop-color="#02050D"/>
    </linearGradient>
    <linearGradient id="wave" x1="330" y1="-20" x2="890" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="0.22" stop-color="#DDEBFF"/>
      <stop offset="0.62" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#0A48B8"/>
    </linearGradient>
    <linearGradient id="accent" x1="40" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4AA8FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#4AA8FF"/>
      <stop offset="0.8" stop-color="#B9D9FF"/>
      <stop offset="1" stop-color="#4AA8FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#84B8FF" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1010" cy="68" r="220" fill="#2563EB" fill-opacity="0.13" filter="url(#glow)"/>
    <circle cx="1010" cy="68" r="148" stroke="#8EC5FF" stroke-opacity="0.18"/>
    <circle cx="1010" cy="68" r="100" stroke="#8EC5FF" stroke-opacity="0.16" stroke-dasharray="3 12"/>

    <path d="M-80 348C218 128 355 126 550 276C737 420 900 442 1280 184" stroke="#1C67D9" stroke-opacity="0.22" stroke-width="62"/>
    <path d="M-80 348C218 128 355 126 550 276C737 420 900 442 1280 184" stroke="url(#wave)" stroke-opacity="0.78" stroke-width="8"/>
    <path d="M-40 386C238 180 360 176 548 308C724 432 946 456 1240 242" stroke="#9BCBFF" stroke-opacity="0.34" stroke-width="2"/>

    <g opacity="0.9" stroke="#DDEBFF" stroke-width="3">
      <path d="M1000 30L1030 48L1012 80L982 62L1000 30Z"/>
      <circle cx="1084" cy="124" r="16"/>
      <path d="M920 118L944 142M944 118L920 142"/>
      <rect x="1048" y="198" width="28" height="28" rx="3"/>
    </g>

    <text x="64" y="72" fill="#9BCBFF" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">NEKO233 // PROFILE CONSOLE</text>
    <text x="64" y="178" fill="#F7FBFF" font-family="Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">neko233</text>
    <text x="68" y="220" fill="#9BCBFF" font-family="Arial, sans-serif" font-size="24" font-weight="500">可乐鸡翅 · TECH LEAD · FULL-STACK ENGINEER</text>

    <g transform="translate(68 278)">
      <rect width="200" height="42" rx="21" fill="#0D2B61" stroke="#5E9FFF" stroke-opacity="0.72"/>
      <circle cx="24" cy="21" r="6" fill="#67B7FF"/>
      <text x="42" y="26" fill="#EAF4FF" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">STATUS  ONLINE</text>
    </g>
    <g transform="translate(284 278)">
      <rect width="224" height="42" rx="21" fill="#0A1B3C" stroke="#5E9FFF" stroke-opacity="0.44"/>
      <text x="22" y="26" fill="#C9E3FF" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">NOW  GAMES + AGENTS</text>
    </g>

    <rect x="64" y="358" width="1072" height="2" fill="url(#accent)"/>
    <text x="64" y="389" fill="#6E9CD5" font-family="monospace" font-size="12" letter-spacing="2">BUILDING USEFUL SYSTEMS · SHIPPING WITH CURIOSITY</text>
    <text x="1136" y="389" text-anchor="end" fill="#6E9CD5" font-family="monospace" font-size="12" letter-spacing="2">01 / 01</text>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="#5E9FFF" stroke-opacity="0.38" stroke-width="2"/>
</svg>
